# Skill 知识库 —— 基础与向量相关技能（阶段三 v1）
# 说明：
#   - skill 名称必须与 knowledge/jobs/ai-application-engineer.yaml 中的技能名完全一致。
#   - prerequisites 只能引用知识库中真实存在的规范技能。
#   - level_guides 的四个等级（入门/初级/中级/高级）必须完整。
# ═══════════════════════════════════════════════════════════════════════════

- skill: Embedding
  category: foundation
  level_guides:
    入门: 知道 embedding 是把文本变成向量的技术，理解"语义相似"大致含义。
    初级: 能用向量化工具把文本转成向量，会做基础的余弦相似度比较。
    中级: 能理解向量检索、向量存储与向量数据库，会设计基于向量的知识检索。
    高级: 能评估不同模型与切分策略对检索质量的影响，能优化索引与召回。
  prerequisites: [Python]
  typical_usage: 是 RAG 和语义检索的基础，用于把文档/查询向量化后在向量库中按语义召回。
  common_pitfalls:
    - 用 embedding 做关键词精确匹配，搞混语义检索与字面检索。
    - 不统一向量化模型，导致查询与文档向量空间不一致。
    - 忽略文本切分，把过长的混合内容一次向量化。
  learning_resources: []
  estimated_weeks: 2