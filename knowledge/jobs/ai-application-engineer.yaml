#
# 【来源索引】
#   jd_hundsun_001   恒生电子 AI应用开发工程师（J10355）  2027届  杭州   状态：待核实
#   jd_zhongzhi_001  北京众智诚坚 AI应用工程师（校招）    实习    北京
#   jd_yisiwei_001   易思维（杭州）AI应用开发工程师       2027届  浙江
#
# 【章节映射规则】—— context 由「原文所在章节」决定，不根据技能含义推断
#   responsibility  ← 恒生电子「岗位职责」
#                     众智诚坚「岗位职责」
#                     易思维「职位描述」（编号 1-7；该页没有"岗位职责"这个标题）
#   qualification   ← 恒生电子「岗位要求」（注意：恒生用的字面是"岗位要求"，
#                     而非"任职要求"，这是该 JD 的原文用词）
#                     众智诚坚「任职要求」
#                     易思维「任职要求」
#   bonus_section   ← 众智诚坚「加分项」
#                     恒生电子、易思维均无独立加分项章节，
#                     故这两份 JD 不会产生该 context 的证据。
#
# 【字段语义】
#   importance        1-5 整数。该技能对岗位的重要程度，人工判断，非招聘方给出的数字。
#   level             岗位要求的推荐能力等级。仅用项目既有四档：
#                     入门 / 初级 / 中级 / 高级。不使用 "无"
#                     （"无" 是 student current_level 的专用值）。
#   requirement_type  该条证据对应的岗位要求性质：required | preferred | bonus
#   context           该条证据所在的原文章节：responsibility | qualification | bonus_section
#
# 【重要区分 —— required 与 context 不可互替】
#   required 描述的是"证据性质"，context 描述的是"证据所在章节"。
#   context: responsibility 的证据**不能单独证明**候选人入职前必须已掌握该技能
#   —— 岗位职责描述的是这份工作要做什么，任职要求描述的才是候选人必须带什么。
#   后续能力评估不得把 responsibility 与 qualification 当作同等强度的招聘门槛。
#
# 【证据唯一性规则】
#   唯一性以"完整 evidence"为单位判断。
#   同一 (source_id, requirement_type, context) 三元组允许重复，
#   只要 note 对应的原文依据不同。不得仅因三元组相同就删除证据。
#
# 【候选技能来源说明】
#   Python / RAG / Agent 三家全部覆盖；LLM API 仅恒生电子；
#   Linux、SQL、计算机网络、操作系统仅恒生电子；
#   Docker、MCP 工具封装仅众智诚坚；易思维全文未提及任何框架与部署要求。
# ═══════════════════════════════════════════════════════════════════════════

